name: Release Dart

on:
  push:
    tags: ['dart-v*']

permissions:
  contents: read

concurrency:
  group: dart-publish
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/dart/tool/requirements.txt
      - run: python packages/dart/tool/release.py validate-tag --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  verify:
    needs: identity
    uses: ./.github/workflows/dart.yml

  publish:
    needs: [identity, verify]
    if: github.repository == 'deancochran/ftms'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: pub-dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.5'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/requirements.txt
      - name: Reproduce and verify the clean tagged candidate
        run: python tool/release.py prepare --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish verified contents and verify public installation
        run: python tool/release.py publish --execute --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dart-release-evidence
          path: packages/dart/build/
          if-no-files-found: error
