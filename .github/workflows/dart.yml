name: Dart verification

on:
  pull_request:
    paths: ['packages/dart/**', 'shared/**', 'LICENSE', '.github/workflows/dart.yml', '.github/workflows/release-dart.yml']
  push:
    branches: [main]
    paths: ['packages/dart/**', 'shared/**', 'LICENSE', '.github/workflows/dart.yml', '.github/workflows/release-dart.yml']
  workflow_call:

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        sdk: ['3.11.0', '3.13.5']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/requirements.txt
      - run: python tool/verify.py --package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dart-${{ matrix.os }}-${{ matrix.sdk }}
          path: packages/dart/build/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compiler: [dart2js, dart2wasm]
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.5'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/requirements.txt
      - run: python tool/verify.py --platform chrome --compiler ${{ matrix.compiler }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dart-${{ matrix.compiler }}
          path: packages/dart/build/
          if-no-files-found: error

  flutter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
          - os: macos-14
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/requirements.txt
      - run: python tool/verify_package.py
      - run: python tool/verify_flutter.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dart-flutter-${{ matrix.target }}
          path: packages/dart/build/
          if-no-files-found: error
