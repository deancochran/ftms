name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Validate npm trusted publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tokenless npm configuration
        shell: bash
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" || -n "${NPM_TOKEN:-}" ]]; then
            echo "::error::Long-lived npm credentials must remain unset for trusted publishing."
            exit 1
          fi

          if [[ "$(npm config get registry)" != "https://registry.npmjs.org/" ]]; then
            echo "::error::Trusted publishing must use the public npm registry."
            exit 1
          fi

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and packed artifact
        run: pnpm verify

      - name: Prepare diagnostic patch version
        id: diagnostic
        shell: bash
        run: |
          package_name=$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.name)')
          base_version=$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version)')

          if ! npm view "$package_name" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Initial package publication is required before trusted publishing can run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          major_minor=${base_version%.*}
          release_version="${major_minor}.${GITHUB_RUN_NUMBER}"
          if npm view "$package_name@$release_version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$package_name@$release_version is already published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npm version "$release_version" --no-git-tag-version
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Require unpublished diagnostic version
        if: steps.diagnostic.outputs.publish != 'true'
        run: |
          echo "::error::Unable to prepare an unpublished version for OIDC validation."
          exit 1

      - name: Validate npm trusted publishing
        if: steps.diagnostic.outputs.publish == 'true'
        shell: bash
        env:
          NPM_CONFIG_DRY_RUN: "true"
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/npm-publish-dry-run.log"
          npm publish --access public --dry-run --ignore-scripts --loglevel verbose 2>&1 | tee "$log_file"

          if ! grep -Fq "npm verbose oidc Successfully retrieved and set token" "$log_file"; then
            echo "::error::npm OIDC token exchange did not succeed."
            exit 1
          fi

          echo "npm OIDC token exchange succeeded during a dry run; no package was published." >> "$GITHUB_STEP_SUMMARY"
