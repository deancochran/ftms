name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    name: Verify and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.18.0

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("packages/typescript/package.json", "utf8"));
          const version = manifest.version;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          if (typeof version !== "string" || !semver.test(version)) {
            throw new Error(`packages/typescript/package.json version is not valid SemVer: ${version}`);
          }

          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} must exactly match packages/typescript/package.json version v${version}`);
          }

          const changelog = readFileSync("packages/typescript/CHANGELOG.md", "utf8").split(/\r?\n/);
          const headings = [`## ${version}`, `## [${version}]`];
          const hasEntry = changelog.some((line) =>
            headings.some((heading) => line === heading || line.startsWith(`${heading} - `)),
          );
          if (!hasEntry) {
            throw new Error(`packages/typescript/CHANGELOG.md must contain a level-two entry for ${version}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `name=${manifest.name}\nversion=${version}\n`);
          NODE

      - name: Verify tokenless npm configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NODE_AUTH_TOKEN:-}" || -n "${NPM_TOKEN:-}" ]]; then
            echo "::error::Long-lived npm credentials must remain unset for trusted publishing."
            exit 1
          fi

          if [[ "$(npm config get registry)" != "https://registry.npmjs.org/" ]]; then
            echo "::error::Trusted publishing must use the public npm registry."
            exit 1
          fi

      - name: Check publication status
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # A missing package/version is a normal first-release condition. Do
          # not turn authentication, DNS, or registry failures into a publish.
          if integrity=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity 2>"$RUNNER_TEMP/npm-view.err"); then
            test -n "$integrity" || { echo '::error::Registry response is missing integrity'; exit 1; }
            echo "remote_integrity=$integrity" >> "$GITHUB_OUTPUT"
          elif grep -Eq 'E404|404 Not Found' "$RUNNER_TEMP/npm-view.err"; then
            echo "remote_integrity=" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-view.err" >&2; exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and packed artifact
        env:
          FTMS_PACKAGE_ARCHIVE: ${{ runner.temp }}/ftms-release.tgz
        run: pnpm --filter @deancochran/ftms verify

      - name: Hash the exact tested archive
        id: package
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ftms-release.tgz"
          test -f "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "integrity=sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Require existing immutable version to match this archive
        id: decision
        env:
          REMOTE: ${{ steps.registry.outputs.remote_integrity }}
          LOCAL: ${{ steps.package.outputs.integrity }}
        run: |
          set -euo pipefail
          node --input-type=module - "$REMOTE" "$LOCAL" >> "$GITHUB_OUTPUT" <<'NODE'
          import { publicationDecision } from "./packages/typescript/scripts/npm-release.mjs";
          const decision = publicationDecision(process.argv[2], process.argv[3]);
          console.log(`publish=${decision.publish}`);
          NODE

      - name: Publish with npm trusted publishing
        if: steps.decision.outputs.publish == 'true'
        run: |
          tag=$(node --input-type=module -e "import { releaseChannel } from './packages/typescript/scripts/npm-release.mjs'; console.log(releaseChannel('${{ steps.release.outputs.version }}'))")
          npm publish '${{ steps.package.outputs.archive }}' --access public --provenance --tag "$tag" --ignore-scripts --loglevel verbose

      - name: Record release
        if: steps.decision.outputs.publish == 'true'
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: echo "Published $PACKAGE_NAME@$PACKAGE_VERSION with npm provenance." >> "$GITHUB_STEP_SUMMARY"

  diagnose:
    if: github.event_name == 'workflow_dispatch'
    name: Validate npm trusted publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tokenless npm configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NODE_AUTH_TOKEN:-}" || -n "${NPM_TOKEN:-}" ]]; then
            echo "::error::Long-lived npm credentials must remain unset for trusted publishing."
            exit 1
          fi

          if [[ "$(npm config get registry)" != "https://registry.npmjs.org/" ]]; then
            echo "::error::Trusted publishing must use the public npm registry."
            exit 1
          fi

      - name: Exercise npm OIDC exchange without publishing
        working-directory: packages/typescript
        shell: bash
        env:
          NPM_CONFIG_DRY_RUN: "true"
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/npm-publish-dry-run.log"
          npm publish --access public --dry-run --ignore-scripts --loglevel verbose 2>&1 | tee "$log_file"

          if ! grep -Fq "npm verbose oidc Successfully retrieved and set token" "$log_file"; then
            echo "::error::npm OIDC token exchange did not succeed."
            exit 1
          fi

          echo "npm OIDC token exchange succeeded during a script-disabled dry run; no package was published." >> "$GITHUB_STEP_SUMMARY"
