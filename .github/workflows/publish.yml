name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    name: Verify and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.18.0

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const version = manifest.version;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          if (typeof version !== "string" || !semver.test(version)) {
            throw new Error(`package.json version is not valid SemVer: ${version}`);
          }

          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} must exactly match package.json version v${version}`);
          }

          const changelog = readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
          const headings = [`## ${version}`, `## [${version}]`];
          const hasEntry = changelog.some((line) =>
            headings.some((heading) => line === heading || line.startsWith(`${heading} - `)),
          );
          if (!hasEntry) {
            throw new Error(`CHANGELOG.md must contain a level-two entry for ${version}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `name=${manifest.name}\nversion=${version}\n`);
          NODE

      - name: Verify tokenless npm configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NODE_AUTH_TOKEN:-}" || -n "${NPM_TOKEN:-}" ]]; then
            echo "::error::Long-lived npm credentials must remain unset for trusted publishing."
            exit 1
          fi

          if [[ "$(npm config get registry)" != "https://registry.npmjs.org/" ]]; then
            echo "::error::Trusted publishing must use the public npm registry."
            exit 1
          fi

      - name: Check publication status
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          versions_file="$RUNNER_TEMP/npm-versions.json"
          npm view "$PACKAGE_NAME" versions --json > "$versions_file"

          if node --input-type=module - "$versions_file" "$PACKAGE_VERSION" <<'NODE'
          import { readFileSync } from "node:fs";

          const versions = JSON.parse(readFileSync(process.argv[2], "utf8"));
          process.exit(Array.isArray(versions) && versions.includes(process.argv[3]) ? 0 : 1);
          NODE
          then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; no publication was attempted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify source and packed artifact
        if: steps.registry.outputs.publish == 'true'
        run: pnpm verify

      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.publish == 'true'
        run: npm publish --access public --provenance --loglevel verbose

      - name: Record release
        if: steps.registry.outputs.publish == 'true'
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: echo "Published $PACKAGE_NAME@$PACKAGE_VERSION with npm provenance." >> "$GITHUB_STEP_SUMMARY"

  diagnose:
    if: github.event_name == 'workflow_dispatch'
    name: Validate npm trusted publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tokenless npm configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NODE_AUTH_TOKEN:-}" || -n "${NPM_TOKEN:-}" ]]; then
            echo "::error::Long-lived npm credentials must remain unset for trusted publishing."
            exit 1
          fi

          if [[ "$(npm config get registry)" != "https://registry.npmjs.org/" ]]; then
            echo "::error::Trusted publishing must use the public npm registry."
            exit 1
          fi

      - name: Exercise npm OIDC exchange without publishing
        shell: bash
        env:
          NPM_CONFIG_DRY_RUN: "true"
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/npm-publish-dry-run.log"
          npm publish --access public --dry-run --ignore-scripts --loglevel verbose 2>&1 | tee "$log_file"

          if ! grep -Fq "npm verbose oidc Successfully retrieved and set token" "$log_file"; then
            echo "::error::npm OIDC token exchange did not succeed."
            exit 1
          fi

          echo "npm OIDC token exchange succeeded during a script-disabled dry run; no package was published." >> "$GITHUB_STEP_SUMMARY"
