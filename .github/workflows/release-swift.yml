name: Release Swift

on:
  push:
    tags: ["swift-v*"]

permissions:
  contents: read

concurrency:
  group: swift-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/native-swift.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: swift-*-evidence
          path: .build/evidence
      - name: Validate release identity and completed evidence
        run: python3 packages/swift/Verification/release.py "$GITHUB_REF_NAME" .build/evidence
      - name: Publish verified source tag and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/github-release-assets.py --repo '${{ github.repository }}' --not-latest --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" --title "FTMS Swift ${RELEASE_TAG#swift-v}" --notes .build/swift-release/notes.md .build/swift-release/*.json .build/swift-release/SHA256SUMS
