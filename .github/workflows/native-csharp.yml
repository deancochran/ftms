name: Verify C#

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source ref to verify (release recovery only)
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csharp-verify-${{ github.workflow }}-${{ inputs.source-ref || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.source-ref == '' }}

jobs:
  verify:
    name: C# / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: packages/csharp
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: packages/csharp/global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test-only schema validator
        run: python -m pip install -r verification/requirements.txt
      - name: Verify source, canonical conformance and installed NuGet consumers
        env:
          PYTHON: python
        run: bash verification/verify.sh
      - name: Verify NativeAOT consumer of the same local package
        if: runner.os == 'Linux'
        run: python verification/verify-aot.py linux-x64
      - name: Retain local verification evidence (not publication)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-${{ matrix.os }}-evidence
          path: packages/csharp/artifacts/*.json
          if-no-files-found: error
          retention-days: 30
