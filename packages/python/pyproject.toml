[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deancochran-ftms"
version = "0.1.0a1"
description = "Pure Python FTMS feature, range, control, measurement, and status codecs (alpha)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dean Cochran" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Source = "https://github.com/deancochran/ftms"
Issues = "https://github.com/deancochran/ftms/issues"
Documentation = "https://github.com/deancochran/ftms/blob/python-v0.1.0a1/packages/python/README.md"

[dependency-groups]
dev = ["jsonschema>=4.23", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-jsonschema>=4.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/deancochran_ftms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E702"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
